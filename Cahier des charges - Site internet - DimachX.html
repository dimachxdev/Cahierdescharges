<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier des charges – Création de site internet | DimachX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#17417C; --night:#0B305A; --orange:#EE7E20; --orange-soft:#FDF1E6;
  --ink:#1B2333; --muted:#5B6578; --line:#DCE2EC; --bg:#F5F7FB; --card:#fff;
  --ok:#1F8A4C; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Montserrat,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--navy)}

/* ---------- Header ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:860px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.top img{height:30px;display:block}
.top .step-label{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.bar{height:5px;background:#E8ECF3}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--orange));transition:width .35s ease}

/* ---------- Layout ---------- */
main{max-width:860px;margin:0 auto;padding:22px 18px 120px}
.step{display:none;animation:fade .3s ease}
.step.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;background:#fff;border-radius:20px;padding:34px 26px 28px;border:1px solid var(--line)}
.hero::before,.hero::after{content:"";position:absolute;top:-40px;right:-40px;width:170px;height:44px;transform:rotate(45deg);transform-origin:center}
.hero::before{background:var(--night);right:-10px;top:10px}
.hero::after{background:var(--orange);right:-52px;top:-14px}
.hero .ico{width:64px;margin-bottom:14px}
.hero h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 10px;font-weight:800;color:var(--night);letter-spacing:-.3px}
.hero h1 span{color:var(--orange)}
.hero p{color:var(--muted);margin:0 0 16px;max-width:620px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:20px 0 6px}
.perk{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px}
.perk b{display:block;font-size:14px}
.perk small{color:var(--muted);font-size:12.5px}
.perk .dot{flex:0 0 30px;height:30px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-weight:800}

.sec-head{margin:4px 0 18px}
.sec-head .kicker{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--orange)}
.sec-head h2{margin:4px 0 6px;font-size:clamp(21px,4.4vw,27px);font-weight:800;color:var(--night);line-height:1.2}
.sec-head p{margin:0;color:var(--muted);font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 6px;margin-bottom:14px}
.q{margin-bottom:18px}
.q > label.ql, .q > .ql{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15.5px;margin-bottom:4px;color:var(--ink)}
.q .req{color:var(--orange)}
.q .hint{font-size:13.5px;color:var(--muted);margin:0 0 9px}
.help.btn{border:none;text-decoration:none;background:var(--orange-soft);color:var(--orange);width:22px;height:22px;border-radius:50%;font-weight:800;font-size:13px;cursor:pointer;flex:0 0 22px;line-height:22px;padding:0}
.help-box{display:none;background:#F0F5FC;border-left:3px solid var(--navy);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--ink);margin:4px 0 10px}
.help-box.open{display:block}

input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=number],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none;transition:border .15s, box-shadow .15s;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(23,65,124,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

/* Choices */
.opts{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opts.cols1{grid-template-columns:1fr}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;background:#fff;min-height:52px;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.opt label:hover{border-color:#B9C5D8}
.opt .box{flex:0 0 22px;height:22px;border:2px solid #B4BFD0;border-radius:6px;display:grid;place-items:center;margin-top:1px;transition:all .15s;background:#fff}
.opt input[type=radio] + label .box{border-radius:50%}
.opt .box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s}
.opt input:checked + label{border-color:var(--navy);background:#F2F6FC;box-shadow:0 0 0 1px var(--navy) inset}
.opt input:checked + label .box{background:var(--navy);border-color:var(--navy)}
.opt input:checked + label .box svg{opacity:1;transform:none}
.opt input:focus-visible + label{box-shadow:0 0 0 3px rgba(238,126,32,.35)}
.opt .t{font-size:14.5px;font-weight:600;line-height:1.3}
.opt .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:3px}
.opt .em{font-size:20px;line-height:1;margin-top:-1px}
.other-input{margin-top:9px}

/* Color */
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.color-item{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 10px 6px 6px;border-radius:12px;font-size:13.5px;font-weight:600}
.color-item input[type=color]{width:44px;height:44px;border:none;border-radius:10px;padding:0;background:none;cursor:pointer}

/* Scale */
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale .opt label{justify-content:center;min-width:56px;padding:12px 10px}
.scale .opt .box{display:none}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center}
.btn{border:none;text-decoration:none;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s, background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--orange);color:#fff;flex:1;max-width:320px;margin-left:auto}
.btn-primary:hover{background:#DB6F15}
.btn-ghost{background:#EEF2F8;color:var(--night)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--night)}
.btn[disabled]{opacity:.45;cursor:default}
.saved{font-size:12px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* Steps menu */
.toc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.toc button.cur{border-color:var(--navy);color:#fff;background:var(--navy)}
.toc button.done{border-color:#BFD8C9;color:var(--ok)}

/* Recap */
.recap-sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.recap-sec h3{margin:0;padding:12px 16px;background:var(--night);color:#fff;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.recap-sec h3 button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.recap-row{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:10px;padding:10px 16px;border-top:1px solid #EEF1F6;font-size:14px}
.recap-row:first-of-type{border-top:none}
.recap-row .k{color:var(--muted);font-weight:600}
.recap-row .v{white-space:pre-wrap;word-break:break-word}
.recap-row .v.empty{color:#A8B0BF;font-style:italic}
@media(max-width:560px){.recap-row{grid-template-columns:1fr;gap:2px}}
.send-card{background:linear-gradient(135deg,var(--night),var(--navy));color:#fff;border-radius:18px;padding:22px;margin:18px 0}
.send-card h3{margin:0 0 6px;font-size:19px}
.send-card p{margin:0 0 14px;opacity:.85;font-size:14px}
.send-actions{display:flex;flex-wrap:wrap;gap:10px}
.send-actions .btn{flex:1 1 200px}
.btn-wa{background:#25D366;color:#fff}
.btn-white{background:#fff;color:var(--night)}
.contact-line{margin-top:12px;font-size:13px;opacity:.9}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.err{color:#C0392B;font-size:13px;font-weight:600;margin-top:6px;display:none}
.q.invalid .err{display:block}
.q.invalid input,.q.invalid textarea{border-color:#E7A39B}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
.foot img{height:22px;vertical-align:middle;opacity:.9}
.tip{display:flex;gap:10px;background:var(--orange-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;color:#7A3E0A}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.sig{grid-template-columns:1fr}}

@media print{
  .top,.nav,.toc,.send-card,.recap-sec h3 button,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0}
  .step{display:none!important}
  #step-recap{display:block!important}
  .recap-sec{break-inside:avoid;border-color:#ccc}
  .print-head{display:flex!important}
}
.print-head{display:none;align-items:center;justify-content:space-between;border-bottom:3px solid var(--orange);padding-bottom:10px;margin-bottom:16px}
.print-head img{height:34px}
</style>
</head>

const KEY = "dimachx_cdc_v1";

try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ data = {}; }
let cur = 0;
try { const s = parseInt(sessionStorage.getItem(KEY+"_step")); if(!isNaN(s)) cur = s; } catch(e){}

const form = document.getElementById("form");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const allFields = [];
STEPS.forEach(st => (st.cards||[]).forEach(c => c.forEach(f => (f.grid ? f.grid : [f]).forEach(x => { x._step = st.id; allFields.push(x); }))));

function fieldHTML(f){
  const req = f.req ? ' <span class="req">*</span>' : "";
  const help = f.help ? `<button type="button" class="help-btn" data-help="${f.id}" aria-label="Explication">?</button>` : "";
  const label = f.label ? `<div class="ql">${esc(f.label)}${req}${help}</div>` : "";
  const hint = f.hint ? `<p class="hint">${esc(f.hint)}</p>` : "";
  const helpBox = f.help ? `<div class="help-box" id="help-${f.id}">💡 ${esc(f.help)}</div>` : "";
  let inner = "";
  if(["text","email","tel","url","date","number"].includes(f.type)){
    inner = `<input type="${f.type}" id="${f.id}" name="${f.id}" placeholder="${esc(f.ph||"")}" ${f.type==="tel"?'inputmode="tel" autocomplete="tel"':""} ${f.type==="email"?'autocomplete="email"':""} ${f.id==="nom"?'autocomplete="name"':""} ${f.id==="entreprise"?'autocomplete="organization"':""} ${f.type==="number"?'inputmode="numeric" min="0"':""}>`;
    inner = inner.replace("<input", `<input class="lbl-${f.id}"`);
    return `<div class="q" data-q="${f.id}">${f.label?`<label class="ql" for="${f.id}">${esc(f.label)}${req}${help}</label>`:""}${hint}${helpBox}${inner}<div class="err">Merci de remplir ce champ.</div></div>`;
  }
  if(f.type==="textarea"){
    inner = `<textarea id="${f.id}" name="${f.id}" placeholder="${esc(f.ph||"")}"></textarea>`;
    return `<div class="q" data-q="${f.id}">${f.label?`<label class="ql" for="${f.id}">${esc(f.label)}${req}${help}</label>`:""}${hint}${helpBox}${inner}<div class="err">Merci de remplir ce champ.</div></div>`;
  }
  if(f.type==="radio" || f.type==="check"){
    const t = f.type==="radio" ? "radio" : "checkbox";
    const opts = f.opts.map((o,i) => {
      const id = `${f.id}_${i}`;
      const parts = o.t.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*|🇫🇷|🇬🇧|🇸🇳|🇪🇺)\s*(.*)$/u);
      const txt = parts ? parts[2] : o.t;
      const emo = parts ? `<span class="em">${parts[1]}</span>` : "";
      return `<div class="opt"><input type="${t}" id="${id}" name="${f.id}" value="${esc(o.v)}"><label for="${id}"><span class="box">${CHECK}</span>${emo}<span class="t">${esc(txt)}${o.h?`<small>${esc(o.h)}</small>`:""}</span></label></div>`;
    }).join("");
    const other = f.other ? `<div class="opt"><input type="${t}" id="${f.id}_autre" name="${f.id}" value="__autre"><label for="${f.id}_autre"><span class="box">${CHECK}</span><span class="em">✏️</span><span class="t">Autre</span></label></div>` : "";
    const otherInput = f.other ? `<input type="text" class="other-input" id="${f.id}__autre_txt" placeholder="Précisez…" style="display:none">` : "";
    return `<div class="q" data-q="${f.id}">${label}${hint}${helpBox}<div class="opts ${f.cols||""}">${opts}${other}</div>${otherInput}<div class="err">Merci de choisir au moins une réponse.</div></div>`;
  }
  if(f.type==="colors"){
    const names = ["Couleur principale","Couleur secondaire","Couleur d'accent"];
    const defs = ["#17417C","#EE7E20","#FFFFFF"];
    inner = `<div class="colors">${names.map((n,i)=>`<label class="color-item"><input type="color" id="${f.id}_${i}" value="${defs[i]}" data-touched="0">${n}</label>`).join("")}</div>`;
    return `<div class="q" data-q="${f.id}">${label}${hint}${inner}</div>`;
  }
  return "";
}

function restore(){
  allFields.forEach(f => {
    const v = data[f.id];
    if(v == null) return;
    if(f.type==="radio" || f.type==="check"){
      const arr = Array.isArray(v) ? v : [v];
      form.querySelectorAll(`input[name="${CSS.escape(f.id)}"]`).forEach(inp => { inp.checked = arr.includes(inp.value); });
      const ot = document.getElementById(f.id+"__autre_txt");
      if(ot){ ot.value = data[f.id+"__autre"] || ""; ot.style.display = arr.includes("__autre") ? "block" : "none"; }
    } else if(f.type==="colors"){
      (v||[]).forEach((c,i)=>{ const el=document.getElementById(`${f.id}_${i}`); if(el && c){ el.value=c; el.dataset.touched="1"; } });
    } else {
      const el = document.getElementById(f.id); if(el) el.value = v;
    }
  });
}

function read(f){
  if(f.type==="radio"){ const c = form.querySelector(`input[name="${CSS.escape(f.id)}"]:checked`); return c ? c.value : ""; }
  if(f.type==="check"){ return [...form.querySelectorAll(`input[name="${CSS.escape(f.id)}"]:checked`)].map(i=>i.value); }
  if(f.type==="colors"){ return [0,1,2].map(i=>{ const el=document.getElementById(`${f.id}_${i}`); return el && el.dataset.touched==="1" ? el.value : ""; }); }
  const el = document.getElementById(f.id); return el ? el.value.trim() : "";
}

let saveT;
function onChange(e){
  const t = e.target;
  if(t.type==="color") t.dataset.touched = "1";
  allFields.forEach(f => {
    data[f.id] = read(f);
    if(f.other){
      const ot = document.getElementById(f.id+"__autre_txt");
      const on = (Array.isArray(data[f.id]) ? data[f.id] : [data[f.id]]).includes("__autre");
      ot.style.display = on ? "block" : "none";
      data[f.id+"__autre"] = ot.value.trim();
    }
  });
  const q = t.closest(".q"); if(q) q.classList.remove("invalid");
  applyConditions();
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(data)); const s=document.getElementById("saved"); s.classList.add("on"); setTimeout(()=>s.classList.remove("on"),1200);}catch(err){}
  }, 350);
}

function visible(f){
  if(!f.showIf) return true;
  return Object.entries(f.showIf).every(([k,vals]) => {
    const v = data[k] || "";
    const arr = Array.isArray(v) ? v : [v];
    return arr.some(x => vals.includes(x));
  });
}
function applyConditions(){
  allFields.forEach(f => { const q = form.querySelector(`[data-q="${f.id}"]`); if(q) q.style.display = visible(f) ? "" : "none"; });
}

function validate(i){
  const st = STEPS[i]; let ok = true, first = null;
  allFields.filter(f => f._step===st.id && f.req && visible(f)).forEach(f => {
    const v = read(f); const empty = Array.isArray(v) ? v.length===0 : !v;
    const q = form.querySelector(`[data-q="${f.id}"]`);
    if(empty){ ok=false; q.classList.add("invalid"); if(!first) first=q; } else q.classList.remove("invalid");
  });
  if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  return ok;
}

function go(i){
  i = Math.max(0, Math.min(STEPS.length-1, i));
  cur = i;
  try{ sessionStorage.setItem(KEY+"_step", i); }catch(e){}
  document.querySelectorAll(".step").forEach(s => s.classList.toggle("active", +s.dataset.i===i));
  const st = STEPS[i];
  document.getElementById("stepLabel").textContent = st.intro ? "Bienvenue" : st.recap ? "Récapitulatif" : `${st.kicker.replace("Étape ","")} / 13 · ${st.title}`;
  document.getElementById("bar").style.width = (i/(STEPS.length-1)*100)+"%";
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  prev.style.visibility = i===0 ? "hidden" : "visible";
  next.style.display = st.recap ? "none" : "";
  next.textContent = i===0 ? (Object.keys(data).length ? "Continuer →" : "Commencer →") : (i===STEPS.length-2 ? "Voir le récapitulatif →" : "Suivant →");
  document.querySelectorAll("#toc button").forEach((b,k)=>{ b.classList.toggle("cur",k===i); b.classList.toggle("done", k<i && k>0); });
  const cb = document.querySelector(`#toc [data-go="${i}"]`); if(cb) cb.scrollIntoView({inline:"center",block:"nearest"});
  if(st.recap) renderRecap();
  window.scrollTo({top:0, behavior:"smooth"});
}

function fmt(f){
  let v = data[f.id];
  if(f.type==="colors"){ v = (v||[]).filter(Boolean); return v.length ? v.join("  ") : ""; }
  if(Array.isArray(v)){
    v = v.map(x => x==="__autre" ? ("Autre : " + (data[f.id+"__autre"]||"—")) : x);
    return v.join(", ");
  }
  if(v==="__autre") return "Autre : " + (data[f.id+"__autre"]||"—");
  if(f.type==="date" && v){ try{ return new Date(v+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}); }catch(e){} }
  return v || "";
}
function labelOf(f){ return f.label || (f.opts && f.opts[0] ? "Accord" : f.id); }

function renderRecap(){
  const body = document.getElementById("recapBody");
  let html = "";
  STEPS.forEach((st,i) => {
    if(st.intro || st.recap) return;
    const fs = allFields.filter(f => f._step===st.id && visible(f) && f.id!=="couleurs_nsp");
    const rows = fs.map(f => {
      let v = fmt(f);
      if(f.id==="couleurs" && (data.couleurs_nsp||[]).length) v = (v? v+" — ":"") + "DimachX propose les couleurs";
      if(f.type==="colors" && v){
        v = (data[f.id]||[]).filter(Boolean).map(c=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px"><span style="width:16px;height:16px;border-radius:4px;border:1px solid #ccc;background:${esc(c)}"></span>${esc(c)}</span>`).join("") + ((data.couleurs_nsp||[]).length?" — DimachX propose les couleurs":"");
        return `<div class="recap-row"><div class="k">${esc(labelOf(f))}</div><div class="v">${v}</div></div>`;
      }
      return `<div class="recap-row"><div class="k">${esc(labelOf(f))}</div><div class="v ${v?"":"empty"}">${v?esc(v):"Non renseigné"}</div></div>`;
    }).join("");
    html += `<div class="recap-sec"><h3>${esc(st.kicker)} · ${esc(st.h)}<button type="button" data-go2="${i}">Modifier</button></h3>${rows}</div>`;
  });
  body.innerHTML = html;
  body.querySelectorAll("[data-go2]").forEach(b => b.onclick = () => go(+b.dataset.go2));
  document.getElementById("printDate").textContent = "Rempli le " + new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});

  const txt = toText();
  const wa = document.getElementById("sendWa");
  const waTxt = txt.length > 3800 ? txt.slice(0,3800) + "\n…(suite par e-mail)" : txt;
  wa.href = `https://wa.me/${AGENCE.whatsapp}?text=${encodeURIComponent(waTxt)}`;
  const mail = document.getElementById("sendMail");
  const subj = `Cahier des charges site internet – ${data.entreprise || data.nom || "Nouveau client"}`;
  mail.href = `mailto:${AGENCE.email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt.slice(0,1800))}`;
  const cl = [];
  if(AGENCE.whatsapp) cl.push("WhatsApp : +" + AGENCE.whatsapp);
  if(AGENCE.email) cl.push("E-mail : " + AGENCE.email);
  document.getElementById("contactLine").textContent = cl.length ? cl.join("  ·  ") : "Astuce : « Copier mes réponses » puis collez-les dans un message WhatsApp ou un e-mail à DimachX.";
}

function toText(){
  const L = [];
  L.push("📋 CAHIER DES CHARGES – CRÉATION DE SITE INTERNET");
  L.push("Agence " + AGENCE.nom + " · " + new Date().toLocaleDateString("fr-FR"));
  L.push("");
  STEPS.forEach(st => {
    if(st.intro || st.recap) return;
    const fs = allFields.filter(f => f._step===st.id && visible(f));
    const lines = fs.map(f => {
      let v = fmt(f);
      if(f.id==="couleurs_nsp") return v ? "• " + v : "";
      return v ? `• ${labelOf(f)} : ${v}` : "";
    }).filter(Boolean);
    if(!lines.length) return;
    L.push("▶ " + st.h.toUpperCase());
    L.push(...lines);
    L.push("");
  });
  return L.join("\n");
}

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2600); }

document.addEventListener("click", async e => {
  if(e.target.closest("#copyBtn")){
    const txt = toText();
    try{ await navigator.clipboard.writeText(txt); toast("✓ Réponses copiées ! Collez-les dans WhatsApp ou un e-mail."); }
    catch(err){
      const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("✓ Réponses copiées !"); }catch(e2){ toast("Copie impossible : sélectionnez le texte manuellement."); }
      ta.remove();
    }
  }
  if(e.target.closest("#printBtn")){ try{ window.print(); }catch(err){} }
  if(e.target.closest("#dlBtn")){
    try{
      const dl = await window.claude.use("downloads");
      const name = "Cahier-des-charges-" + (data.entreprise||"client").replace(/[^\w\-]+/g,"-") + ".txt";
      await dl.save({filename:name, data:toText()});
      toast("✓ Fichier enregistré");
    }catch(err){ toast("Téléchargement annulé"); }
  }
  if(e.target.closest("#resetBtn")){
    const b = e.target.closest("#resetBtn");
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="⚠️ Touchez encore pour tout effacer"; setTimeout(()=>{b.dataset.confirm="0"; b.textContent="🗑️ Effacer et recommencer";},3500); return; }
    data = {}; try{ localStorage.removeItem(KEY); }catch(err){}
    form.reset(); form.querySelectorAll('input[type=color]').forEach(c=>c.dataset.touched="0");
    form.querySelectorAll(".other-input").forEach(o=>o.style.display="none");
    applyConditions(); go(0); toast("Formulaire effacé");
  }
});

document.getElementById("next").onclick = () => { if(validate(cur)) go(cur+1); else toast("Il manque une réponse obligatoire (*)"); };
document.getElementById("prev").onclick = () => go(cur-1);

build(); restore(); applyConditions(); go(cur);

// Impression : uniquement hors cadre (site DimachX), refusée dans la visionneuse
try{ if(window.self === window.top) document.getElementById("printBtn").style.display = ""; }catch(e){}
// Téléchargement si la capacité est disponible
(async () => {
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(dl) document.getElementById("dlBtn").style.display = "";
    }
  }catch(e){}
})();
</script>
